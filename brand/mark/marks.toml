# Lemur mark compositions. Colors name palette primitives from brand/tokens.toml.
# Params are numbers substituted into {{param.x}}; "tail" is built in (drawn from [tail]).
# [mark.<name>.tail] overrides any [tail] key for that mark (and its children). Colors: ring, stripe,
# arrow (default stripe), tailHalo (+ param haloWidth). Derived params for parts: tailCx, tailCy, tailR,
# tailWidth, tailStartX/Y, tailEndX/Y.
schema = 1

[tail]
cx = 128
cy = 136
r = 96
start_deg = 115      # 0 = 3 o'clock, clockwise
sweep_deg = 290      # the gap is the sync loop's opening
width = 22
rings = 7            # dark bands on the light tail

[mark.app]
parts = ["badge", "tail", "head", "mask", "eyes"]
colors = { badge = "charcoal-800", bevel = "charcoal-700", fur = "stone-400", ring = "bone", stripe = "charcoal-950", arrow = "bone", eye = "amber-500", pupil = "charcoal-950" }
params = { badgeInset = 16, badgeSize = 224, badgeRadius = 56 }

[mark.appSquare]     # iOS: full-bleed and opaque; the OS rounds the corners
extends = "app"
params = { badgeInset = 0, badgeSize = 256, badgeRadius = 0 }

[mark.glyph]         # in-app: no badge, transparent background
parts = ["tail", "head", "mask", "eyes"]
colors = { fur = "stone-400", ring = "bone", stripe = "charcoal-950", arrow = "bone", eye = "amber-500", pupil = "charcoal-950" }

[mark.controller]    # small family (<= 48 px): SNES-style pad, two amber buttons are the eyes
parts = ["controller"]
colors = { body = "stone-300", outline = "charcoal-950", light = "bone", eye = "amber-500", red = "red-500", blue = "blue-500" }
params = { cy = 128, scale = 1 }

[mark.controllerSquare]   # iOS small sizes: full-bleed and opaque
extends = "controller"
parts = ["bg", "controller"]
colors = { bg = "charcoal-800" }
params = { scale = 0.9 }

[mark.tray]          # base for the six tray states, not an output itself
extends = "controller"
parts = ["controller", "status-dot"]
colors = { symbol = "bone" }
params = { cy = 86, scale = 0.92, dotR = 52, hollow = 0 }

[mark.tray-synced]
extends = "tray"
colors = { status = "green-500" }
params = { symbol = 1 }      # 1 check, 2 arrows, 3 bars, 4 slash, 5 !, 6 x

[mark.tray-syncing]
extends = "tray"
colors = { status = "blue-500" }
params = { symbol = 2 }

[mark.tray-paused]
extends = "tray"
colors = { status = "stone-400" }
params = { symbol = 3 }

[mark.tray-offline]
extends = "tray"
colors = { status = "stone-500" }
params = { symbol = 4, hollow = 1 }

[mark.tray-attention]
extends = "tray"
colors = { status = "amber-500" }
params = { symbol = 5 }

[mark.tray-error]
extends = "tray"
colors = { status = "red-500" }
params = { symbol = 6 }
