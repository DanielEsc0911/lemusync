[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1-alpha.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/DanielEsc0911/lemusync"
rust-version = "1.99" # same as rust-toolchain.toml

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
# Comment-preserving edits by `lemusync config set` (same version `toml` already pulls in).
toml_edit = "0.25.17"
thiserror = "2.0.21"
chacha20poly1305 = "0.11.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
blake3 = "1.8.7"
zeroize = { version = "1.9.1", features = ["derive"] }
getrandom = "0.4.3"
tokio = "1.53.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
opendal = { version = "0.59.5", default-features = false, features = ["services-gdrive", "services-fs", "services-s3", "executors-tokio"] }
tempfile = "3.27.0"
# Benches only (crates/engine/benches). No plotters/rayon.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false, features = ["rustls-no-provider"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "form", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
url = "2.5.8"
base64 = "0.23.1"
sha2 = "0.11.1"
keyring = { version = "3.6.3", default-features = false }
# Linux Secret Service client (crates/engine/src/secret_service.rs); already in the tree via `keyring`.
dbus = { version = "0.9.12", features = ["vendored"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
directories = "6.0.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
roxmltree = "0.21.1"
# Save-folder watcher (crates/engine/src/watch.rs). Only the OS backends; FSEvents on macOS.
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
clap = { version = "4.6.7", features = ["derive"] }
rpassword = "7.5.4"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
# Own uid for the IPC peer check (crates/ipc); already in the tree through tempfile.
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
# Linux desktop presence in lemusyncd (desktop §Linux results). Linux-only target deps there.
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
notify-rust = { version = "4.18.2", default-features = false, features = ["z-with-tokio"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev]
# File and line info only: keeps target/ small, backtraces keep file:line (D37).
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
