[package]
name = "lemusync-engine"
description = "Sync engine orchestration."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Test-only fault injection (crates/engine/src/failpoints.rs).
failpoints = ["lemusync-store/faults"]

[dependencies]
lemusync-api = { path = "../api" }
lemusync-core = { path = "../core" }
lemusync-crypto = { path = "../crypto" }
lemusync-store = { path = "../store" }
directories = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
toml_edit = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
lemusync-engine = { path = ".", features = ["failpoints"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
criterion = { workspace = true }

[[bench]]
name = "budgets"
harness = false

# Linux keystore: our own Secret Service client (src/secret_service.rs) over libdbus built from
# source, because `keyring` can't stop D-Bus activation or its own unlock calls.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
