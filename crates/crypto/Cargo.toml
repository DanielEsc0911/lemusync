[package]
name = "lemusync-crypto"
description = "Encryption, key derivation and keyed hashing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
blake3 = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }

# The Secret Service transport session (src/secret_service.rs). RustCrypto crates move together:
# aes, cbc, hkdf and sha2 must share one `cipher`/`digest` generation, so bump them as a set.
[target.'cfg(target_os = "linux")'.dependencies]
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
hkdf = "0.13.0"
num-bigint = "0.4.8"
sha2 = { workspace = true }
